name: check
on:
  workflow_dispatch:
concurrency:
  group: monitor
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ellenőrzés
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          HC_API_KEY: ${{ secrets.HC_API_KEY }}
          HC_PING_URL: ${{ secrets.HC_PING_MONITOR_CHECKER }}
          SB_URL_CC: ${{ secrets.SB_URL_CC }}
          SB_URL_SUPREMEX: ${{ secrets.SB_URL_SUPREMEX }}
          SB_URL_VEDIKUS: ${{ secrets.SB_URL_VEDIKUS }}
          MONITOR_ANTHROPIC_KEY: ${{ secrets.MONITOR_ANTHROPIC_KEY }}
          MONITOR_OPENAI_KEY: ${{ secrets.MONITOR_OPENAI_KEY }}
          PUBLIC_PREFIX: ${{ secrets.PUBLIC_PREFIX }}
          RUN_ID: ${{ github.run_id }}
        run: node check.mjs
